[project]
name = "data"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
data-daily = "data.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data"]

[tool.pytest.ini_options]
pythonpath = ["src"]
