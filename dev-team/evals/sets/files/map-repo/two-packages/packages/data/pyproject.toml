[project]
name = "data"
version = "0.3.0"
description = "Daily bars: download from the vendor, clean, store as parquet"
requires-python = ">=3.12"
dependencies = ["pandas>=2.2", "pyarrow>=16", "httpx>=0.27"]

[project.scripts]
data-daily = "data.cli:daily"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
