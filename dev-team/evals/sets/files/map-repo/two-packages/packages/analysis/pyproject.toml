[project]
name = "analysis"
version = "0.1.0"
description = "Features and a daily report built on stored bars"
requires-python = ">=3.12"
dependencies = ["data", "pandas>=2.2", "jinja2>=3.1"]

[project.scripts]
analysis-report = "analysis.report.render:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
