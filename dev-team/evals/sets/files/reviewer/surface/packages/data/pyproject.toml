[project]
name = "data"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pandas>=2.2", "pyarrow>=17"]

[project.scripts]
data-daily = "data.pipelines:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data"]
