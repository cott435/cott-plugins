[project]
name = "trade-tape"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
data = { workspace = true }

[dependency-groups]
dev = ["pytest", "pytest-mock", "pytest-cov", "ruff>=0.16.0", "pylint", "mypy", "interrogate", "import-linter", "mkdocs-material", "mkdocstrings[python]"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 88
# PLR0917 (below) is preview-only before this version: an older ruff prints a warning, skips
# the rule and exits 0, so a repo would lose its argument cap without anyone noticing. With
# this line an older ruff refuses to run and says why.
required-version = ">=0.16.0"
# docs/ is planning documents and researcher probe scripts, never package source. ruff 0.16
# formats Python blocks inside Markdown, and no run may edit a design to satisfy a formatter.
# .claude/ holds project skills, whose reference code is extracted from an old repo as it was;
# the repo-wide `ruff check` would hold every implementer to its style.
extend-exclude = ["docs", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C901", "PLR0917", "PLR0915", "S", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"        # python-style-guide: docstrings on everything, Google style

[tool.ruff.lint.per-file-ignores]
# Asserts and undocumented tests are fine. So is a test or fixture with many arguments: pytest
# injects one per fixture and one per parametrize name, so PLR0917's cap (project-structure's
# limit on a function's design) would force contorted fixtures, not better code.
"tests/**" = ["S101", "D", "PLR0917"]
"**/tests/**" = ["S101", "D", "PLR0917"]
# Intent tests are written from the design before the code exists, so a design that states
# "raises on a bad row" without naming the type is asserted as written. B017/PT011 would make
# that an error, and the only fixes available to the tester are an inline `# noqa` — which
# docs/constraints.md §Guarded grades CRITICAL — or an assertion the design does not support.
# The rule is kept for src, where the exception type is a choice someone made.
"tests/intent/**" = ["S101", "D", "B017", "PT011", "PLR0917"]
"**/tests/intent/**" = ["S101", "D", "B017", "PT011", "PLR0917"]
"scripts/**" = ["D"]
"**/scripts/**" = ["D"]
# project-structure: every nested `__init__.py` is empty, so D104 (a docstring in every
# package) is off below `src/<pkg>/`. The package's own `src/<pkg>/__init__.py` is its public
# surface and keeps the rule.
"**/src/*/*/**/__init__.py" = ["D104"]

[tool.ruff.lint.mccabe]
max-complexity = 10          # project-structure §2 hard limit

[tool.ruff.lint.pylint]
max-positional-args = 5      # project-structure §2 hard limit; keyword-only parameters are free
max-statements = 50          # project-structure §2 hard limit

[tool.pylint.format]
max-module-lines = 1000      # project-structure §2 hard limit

[tool.pylint.design]
max-public-methods = 20      # project-structure §2 hard limit

[tool.importlinter]
root_packages = ["data"]

[[tool.importlinter.contracts]]
name = "data: section layering"
type = "layers"
containers = ["data"]
layers = ["(storage)", "(clean)", "ingest"]

[tool.mypy]
mypy_path = ["packages/data/src"]
