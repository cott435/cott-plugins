# contracts.yml — the cross-file claims this bundle's agents act on, checked by
# plugin-dev's `check-contracts`. One entry per claim that is true only because two files
# agree, and that nothing fails on when they stop agreeing.

# A pattern that must not appear in an authored file.
forbid:
  - name: no skill or agent description contains an XML-style tag
    # claude.ai rejects the whole plugin ("SKILL.md description cannot contain XML tags")
    # for any <word> in a frontmatter description, so the desktop app stops listing it. The
    # CLI accepts it, so nothing else catches this. Write placeholders as {word}.
    pattern: '^description:.*<[A-Za-z/]'
    files: ['agents/*.md', 'skills/*/SKILL.md']
    unless:
      - 'extracted from a prior implementation'  # researcher's project-skill template body, not frontmatter

  - name: no file promises a repo a `scripts/` directory
    # project-structure §1 forbids it outright: an entry point must be importable from the
    # installed package, so anything runnable is a function in src/<pkg>/cli.py.
    pattern: '\bscripts/|the scripts that'
    # `near` scopes every exemption below to the match it pardons plus 40 characters either
    # side, not the whole line. Line-scoped, these eight pardoned ten lines outright — every
    # line in the bundle where `scripts/` is discussed, which is exactly where a wrong
    # statement would be written. Probed: evals/2026-09-17-forbid-exemption-scope.md.
    near: 40
    unless:
      - 'no `scripts/`'                 # the prohibition stating itself, and explaining why
      - 'directory beside `src/` looks'
      - 'skills/status/scripts'         # this plugin's own tooling, not a repo it plans
      - 'scripts/status\.py'
      - 'plugin-dev/scripts'

  - name: the package API page is never credited to finalize-project alone
    # The surface section's implementer writes it as each package ships; finalize-project
    # lists a missing one under Known gaps and writes none.
    pattern: 'api/<pkg>\.md|api/\$pkg\.md|api/data\.md|api/<pkg>/index\.md|api/data/index\.md'
    near: 40
    all_of: ['finalize-project']
    unless: ['surface section', 'the implementer', 'Known gaps']

  - name: no unprefixed plugin command is typeable
    # Plugin skills are always namespaced /dev-team:<name>, so a bare /<name> is a command
    # nobody can run. Structural rather than a list of the skill names: any slash-initial token
    # with a hyphen, plus /status, that is not already prefixed. Claude Code's own commands
    # have no hyphen (/agents, /model, /plugin) and so never match. README.md is in scope with
    # every other authored file.
    #
    # Both exceptions are in the pattern, not in `unless`, because `unless` exempts the whole
    # line: a bare command written beside /reload-plugins would have been exempted with it.
    # /reload-plugins is Claude Code's own command.
    # A plugin-dev command (the same slash form, with `plugin-dev:` after the slash) is
    # prefixed too: the notes under site/notes/ name them, and they are typeable wherever
    # plugin-dev is installed.
    pattern: '(^|[\s"(\[`])/(?!dev-team:|plugin-dev:|reload-plugins)(?:[a-z][a-z0-9]*-[a-z0-9-]+|status)\b'

  - name: no file leaves the repo-wide pytest to CI alone
    # 2.8: the stop gate skips a `repo`-scope pytest row, and the integration check
    # (`gate_on_stop.py --integration`) runs it before the paths review and the close. A file
    # that still calls that row "CI's" tells a reader nothing local ever runs it.
    pattern: "(?:pytest|row) (?:is|are) CI's|SKIPPED`?: CI's|leaves to CI\\b"
    # The notes under site/notes/ are the record of what each release decided, 2.2's included,
    # and are not rewritten; every file that describes the plugin as it is now is in scope.
    files: ['agents/*.md', 'skills/**/*.md', 'skills/**/*.py', 'hooks/*.py', 'README.md', 'site/reference/*.md', 'site/*.md', 'site/workflows/*.md']

  - name: no agent or skill stages everything
    # §Project convention stages by explicit path, so a run never commits a file it did not
    # write. Scoped with `files:` so the 0.5 design note, which quotes the pattern, is not a
    # finding; the one exemption is the rule stating itself.
    pattern: 'git add -A|git add \.|git commit -a\b'
    files: ['agents/*.md', 'skills/**/*.md']
    unless: ['Never `git add -A`']

  - name: no forked run waits on a background notification
    # A forked architect or curator never receives its backgrounded agents' completion
    # notifications — they go to the conversation that forked it — so every spawn is
    # run_in_background: false (each agent's Hard rules). Eval D run 2 ended on `echo waiting`
    # with its fan-out's results never read: evals/2026-09-18-d2-foreground-fanout.md.
    pattern: 'background-task notification|completion notification is your cue|[Cc]ontinuing after backgrounded'
    files: ['agents/*.md', 'skills/**/*.md']

  - name: every forked skill names its agent with the plugin prefix
    # A bare `agent: architect` does not resolve to the plugin agent: the fork silently runs as
    # general-purpose, without the agent's prompt, and eval D's architect fork never saw its own
    # Hard rules. Only `dev-team:<agent>` resolves, as for subagent_type in eval A3.
    # Probed: evals/2026-09-18-d2-foreground-fanout.md.
    pattern: '^agent: (?!dev-team:)'
    files: ['skills/**/SKILL.md']

  - name: the tester names the implementer's test tree only to forbid it
    # Two vantage points, two trees: tests/unit/<section> is the implementer's, written from
    # the code; tests/intent/<section> is the tester's, written from the spec. A tester prompt
    # that tells it to read or write the unit tree collapses the two into one.
    pattern: 'tests/unit/<section>'
    files: ['agents/tester.md']
    unless: ['never `tests/unit/`']

  - name: the vendored constraints method never leaks its upstream file name
    # The file is docs/constraints.md here; upstream writes CONSTRAINTS.md at the repo root. A
    # reader told to open the upstream name opens nothing. `files:` keeps site/notes/ (the 0.5
    # design set, which discusses the rename) out of scope; the one exemption is the vendored
    # reference's Provenance line stating the rename.
    pattern: 'CONSTRAINTS\.md'
    files: ['agents/*.md', 'skills/**/*.md', 'README.md', 'site/reference/*.md']
    unless: ['upstream writes `CONSTRAINTS.md`']

  - name: run-package spawns every agent by its plugin-prefixed name
    # The driver runs in the main conversation and spawns with the Agent tool; a bare
    # subagent_type does not resolve to the plugin agent (eval A3: only `dev-team:<agent>`
    # does). Every spawn it names is namespaced.
    pattern: 'subagent_type: "(?!dev-team:)'
    files: ['skills/run-package/SKILL.md']

  - name: no prompt sends a shell outside the repo to find a file
    # eval K: an implementer that had already read a skill through ${CLAUDE_PLUGIN_ROOT} ran
    # `find /` for it anyway and listed copies across the user's home directory. Nothing here
    # may suggest that; the agents' Bash rules forbid it.
    pattern: 'find\s+(/|~|\$HOME)'
    unless: ['off limits']
    near: 90
    files: ['agents/*.md', 'skills/**/*.md']

  - name: the architect spawns researchers and architects by their plugin-prefixed names
    # Same platform fact, one layer down: a forked architect fanning out with a bare
    # name silently gets a general-purpose agent, which loads none of the role's prompt
    # (eval K run 5). It spawns researchers (datasets) and architects (map-repo), never
    # designers; its instructions name the agent, so they name it namespaced.
    # The second branch catches a designer fan-out in any spelling, prefixed or not.
    pattern: '\b(?<!dev-team:)(architect|researcher)`? per (package|source|dataset)|\b(dev-team:)?designer`? per section'
    near: 60
    unless: ['dev-team:architect', 'dev-team:researcher']
    files: ['agents/architect.md']

  - name: the review loop's exit is never bypassed by a bare next command
    # The cap lives in status.py (BLOCKED at round 3, or round 2 with a prior unfixed); a
    # sentence in the driver or the reviewer that names the implementer as the next step on
    # `request changes` without the cap bypasses it. Six consecutive plan reviews on one
    # package, each clearing the last and adding two, is what an uncounted loop did in 0.5.
    pattern: 'on `request changes`, (spawn|run) the implementer'
    near: 200
    unless: ['cap', 'BLOCKED', 'status.py']
    files: ['agents/reviewer.md', 'skills/run-package/SKILL.md']

  - name: every Focus value the driver or the reviewer writes is one the reviewer runs
    # The field claims check field names, not values: a `Focus: correctnes` line passes them
    # and reaches a reviewer with no such section to follow. The five values are the
    # reviewer's own `## Focus:` headings.
    pattern: 'Focus: (?!(conformance|correctness|full|defer|paths)\b)'
    files: ['agents/*.md', 'skills/**/*.md']

  - name: every hook matcher and agent_type names an agent this plugin ships
    # A SubagentStop matcher or an agent_type test on a name with no agents/<name>.md never
    # fires, and the gate it implements silently does not exist.
    pattern: 'dev-team:(?!architect|designer|researcher|tester|implementer|reviewer|documenter|curator|profiler)[a-z-]+'
    files: ['hooks/hooks.json', 'hooks/*.py']

  # The six claims below hold the 2.2 paths and defaults against drift. Each is scoped with
  # `files:` to the authored prose (site/notes/ quotes the old spellings on purpose) and
  # exempts with `near:`, so a sentence that names an old path as still read passes and a
  # sentence that writes to it fails. Planted defects: evals/2026-09-30-2.2-docs-and-release.md.
  - name: no file writes to the 2.0 ledger path
    # Since 2.2 the section ledger is docs/packages/<pkg>/deviations/<section>.md; the 2.0 path
    # is read, never written. A writer told the old path splits one section's entries in two.
    pattern: 'docs/deviations/<pkg>/<section>\.md|docs/deviations/\$pkg/|docs/deviations/<pkg>/\*'
    near: 90
    unless: ['older', 'still read', 'pre-2.2', '2.0 ', 'edited in place', 'where it is']
    files: ['agents/*.md', 'skills/**/*.md', 'README.md', 'site/reference/*.md', 'site/flow.md', 'site/site.yml', 'site/workflows/*.md']

  - name: no file writes a review report to docs/reviews/
    # Reports are docs/packages/<pkg>/reviews/<section>/<date>-r<n>-<letter>.md since 2.2.
    pattern: 'docs/reviews/<date>|docs/reviews/\*-<pkg>|Write to `docs/reviews/'
    near: 90
    unless: ['older', 'still read', 'pre-2.2', '2.0 ']
    files: ['agents/*.md', 'skills/**/*.md', 'README.md', 'site/reference/*.md', 'site/flow.md', 'site/site.yml', 'site/workflows/*.md']

  - name: no file writes a change file to docs/changes/
    # Change files are docs/packages/<pkg>/changes/<slug>.md, one per affected package.
    pattern: 'docs/changes/<slug>\.md|docs/changes/\*'
    near: 90
    unless: ['older', 'still read', 'pre-2.2', '2.0 ']
    files: ['agents/*.md', 'skills/**/*.md', 'README.md', 'site/reference/*.md', 'site/flow.md', 'site/site.yml', 'site/workflows/*.md']

  - name: the stop marker is per section
    # .dev-team/stop/<pkg>/<section>; a bare .dev-team/stop is 2.1's and a sibling's marker
    # under parallel implementers.
    pattern: '\.dev-team/stop\b(?!/)'
    files: ['agents/*.md', 'skills/**/*.md', 'hooks/*.py', 'README.md', 'site/reference/*.md', 'site/flow.md', 'site/site.yml', 'site/workflows/*.md']

  - name: the tester's mode field is Design mode
    # 2.1's `Adopted code:` spawn field is `Design mode: new | document | delta` since 2.2.
    pattern: 'Adopted code'
    files: ['agents/*.md', 'skills/**/*.md', 'README.md', 'site/reference/*.md', 'site/flow.md', 'site/site.yml', 'site/workflows/*.md']

  - name: nothing says implementers run one at a time except to describe --serial
    pattern: '[Ii]mplementers? (run )?(one at a time|never run in parallel|×1, sequential)|one implementer at a time'
    near: 120
    unless: ['--serial']
    files: ['agents/*.md', 'skills/**/*.md', 'README.md', 'site/reference/*.md', 'site/flow.md', 'site/site.yml', 'site/workflows/*.md']
  - name: no prompt names the argument-count rule the lint block dropped
    # 2.5 caps positional parameters (PLR0917, max-positional-args). PLR0913 counted
    # keyword-only ones too, which is what pushed implementers into options bags. A prompt
    # that still names the old rule sends an agent to a check that no longer runs.
    pattern: 'PLR0913|\bmax-args\b'
    files: ['agents/*.md', 'skills/**/*.md', 'pyproject-lint-config.toml']
  - name: nothing counts on a hand-back after the first
    # With SubagentHandback a caller receives an agent's first report and nothing after it
    # (plugin-anatomy, agents.md, What reaches its caller). An agent told to amend its report,
    # or a hook telling it to, writes text nobody reads; the outcome is in the gate's record.
    pattern: 'Amends:|hand back an amendment|takes your \*\*last\*\* turn|takes your last turn|its \*\*last\*\* hand-back'
    files: ['agents/*.md', 'skills/**/*.md', 'hooks/*.py']

  - name: nothing says the surface section is designed last or from the shipped READMEs
    # Since 2.6 the surface is designed right after PLAN from the contract's Section
    # interfaces, Pipelines, Public surface (intent) and Call paths, and only built last from
    # the READMEs. A prompt that still says "designed last" or "designed from every sibling
    # README" sends the surface designer to files that do not exist yet. `near` keeps the one
    # true statement — the code is built last, from the shipped READMEs — out of scope. The
    # user-facing docs (README.md, site/flow.md, site/workflows/) are swept too, so a reader
    # learns the new order before meeting it in a run.
    pattern: 'designed last|from (?:every|the) (?:sibling|shipped) READMEs?'
    near: 60
    unless: ['built last', 'built, last', 'IMPLEMENT']
    files: ['agents/*.md', 'skills/**/*.md', 'README.md', 'site/reference/*.md', 'site/flow.md', 'site/site.yml', 'site/workflows/*.md']

  - name: no driver prompt field sends intent tests at the repo root
    # Intent tests live under the package root (`packages/<pkg>/tests/intent/<section>/` in a
    # uv workspace), as the tester writes them and the implementer runs them. A prompt field
    # whose value is the bare `tests/intent/<section>/` sends the reviewer to a directory that
    # does not exist; 2.6-spine phase 7's eval 16 reviewer met it. Table cells only: prose
    # that says "`tests/intent/<section>/` under the package root" is right.
    pattern: '\| `tests/intent/<section>/?` \|'
    files: ['skills/**/SKILL.md']

# Every heading a reader parses is one the owner's template defines.
headings:
  - name: interface.md headings its readers parse are ones the implementer writes
    owner: agents/implementer.md
    owner_span: ['1. **Public names**', null]
    readers:
      - file: agents/documenter.md
        span: ['The ones you read are', 'spelled exactly like that']
      - file: agents/reviewer.md
        cites: ['Public names', 'Shapes provided']
      - file: skills/sync-plan/SKILL.md
        cites: ['Consumers (computed)']
      - file: skills/finalize-project/SKILL.md
        cites: ['Public names']
      # pair treats a change to the surface's Public names as a spec-change.
      - file: skills/pair/SKILL.md
        cites: ['Public names']

  - name: probe doc headings its readers parse are ones planning-templates defines
    # A probe doc is the external provider's interface.md, and four agents parse it by heading:
    # the architect stops on Access and reads Supported tasks and Splitting back into the
    # package contract, the designer builds the parser and the feature set from it, the reviewer
    # checks shipped code against Target, Leakage and Splitting, and the implementer falls back
    # to it when its own design disagrees. The researcher writes the document but owns no
    # heading: the template is a reference file, like the architect's five. Both kinds — api and
    # dataset — sit in one span, because a reader cites a heading without knowing which kind the
    # section it is designing will get.
    owner: skills/planning-templates/references/source-probe.md
    owner_span: ['## Kind `api`', null]
    readers:
      - file: agents/designer.md
        cites: ['Observed schema', 'Access', 'Pagination', 'Rate limits and quotas',
                'Error responses', 'Write semantics', 'Webhooks', 'Duplicates and keys',
                'Target', 'Leakage', 'Features', 'Splitting', 'Supported tasks', 'Quirks']
      - file: agents/architect.md
        cites: ['Access', 'Quirks', 'Observed schema', 'Supported tasks', 'Splitting']
      - file: agents/reviewer.md
        cites: ['Observed schema', 'Target', 'Leakage', 'Splitting']
      - file: agents/implementer.md
        cites: ['Observed schema', 'Leakage']

  - name: data profile headings its readers parse are ones planning-templates defines
    # A profile is a probe doc of kind `stage`. The profiler writes it by these headings;
    # the designer finds the kinds under Quirks and the schema under Observed schema with no
    # edit to its own file, so the template must keep the source probe's spelling.
    owner: skills/planning-templates/references/data-profile.md
    owner_span: ['1. **Access**', null]
    readers:
      - file: agents/profiler.md
        cites: ['Access', 'Provenance', 'Plan', 'Shape', 'Observed schema', 'Duplicates and keys',
                'Checks', 'Quirks', 'Unexplained', 'Expected and not found', 'Rounds',
                'Cost and time of a full pass', 'Sections served']
      - file: agents/designer.md
        cites: ['Observed schema', 'Quirks', 'Duplicates and keys']
      - file: skills/status/scripts/status.py
        cites: ['Sections served']
      - file: skills/data-quality/SKILL.md
        cites: ['Plan', 'Observed schema', 'Checks', 'Quirks', 'Unexplained']

  - name: section README headings its readers parse are ones the implementer writes
    owner: agents/implementer.md
    owner_span: ['## Section README template', '## The surface section']
    readers:
      - file: agents/documenter.md
        cites: ['Entry points and interfaces']
      # The tester builds fakes to a dependency README's shipped signatures.
      - file: agents/tester.md
        cites: ['Entry points and interfaces']
      # A README under `Dependency READMEs:` outranks the contract for the names the
      # designer consumes; the `surface` section's design is built from every sibling's.
      - file: agents/designer.md
        cites: ['Entry points and interfaces']
      # The conformance reviewer checks seams against a sibling's shipped README, and reads
      # item 7 for the deviations entries it cites.
      - file: agents/reviewer.md
        cites: ['Entry points and interfaces', 'Implementation notes']
      # pair briefs the user from Purpose and the Public: yes rows, and at wrap-up cites each
      # new ledger entry under Implementation notes.
      - file: skills/pair/SKILL.md
        cites: ['Purpose', 'Entry points and interfaces', 'Implementation notes']
      # data-quality has the README list the handlers by kind id and name the profile.
      - file: skills/data-quality/SKILL.md
        cites: ['Pipeline / workflow', 'Implementation notes']

  - name: design headings the tester writes tests from are ones the designer's template defines
    # The tester inventories its cases by design heading and cites them in every test's
    # docstring; a renamed heading leaves it inventorying a section no design has. The Module
    # plan is a bolded term inside item 3, not a numbered item, so the owner parser cannot see
    # it; the tester cites item 3 by name, and the Module plan rides on that. The design's
    # first line, `Mode:`, is not a numbered item either; the tester reads it beside its
    # `Design mode:` field. No reader cites `As shipped` or `Revision`: the template has none.
    owner: agents/designer.md
    owner_span: ['## Design document template', null]
    readers:
      - file: agents/tester.md
        cites: ['Interfaces', 'Inputs and outputs', 'Workflow / pipeline',
                'Error handling and logging', 'Tests', 'Data model / internal contracts']
      # The conformance reviewer's Coverage table has one row per Interfaces row, Workflow
      # step, Error handling case and named Test, and judges Open questions by their assumption.
      - file: agents/reviewer.md
        cites: ['Interfaces', 'Workflow / pipeline', 'Error handling and logging', 'Tests',
                'Open questions']
      # data-quality puts the kinds table under Workflow / pipeline and names its cases.
      - file: skills/data-quality/SKILL.md
        cites: ['Workflow / pipeline', 'Tests', 'Skills used', 'Open questions']

  - name: every agent that commits cites the one commit rule, by its rule names
    # git-workflow-and-versioning §Project convention is the one copy of the run gate, staging,
    # message, one-commit and lock rules; agents cite it and never restate it. Each reader's span starts
    # at its `§Project convention` citation, so an agent that stops citing it fails as a missing
    # marker, and the bolded rule names inside the span must be ones the section numbers.
    owner: skills/git-workflow-and-versioning/SKILL.md
    owner_span: ['## Project convention', '## Core Principles']
    readers:
      - file: agents/implementer.md
        span: ['§Project convention', 'trailer from']
      - file: agents/reviewer.md
        span: ['§Project convention', 'rules; stage']
      - file: agents/architect.md
        span: ['§Project convention', 'rules before writing']
      - file: agents/curator.md
        span: ['§Project convention', 'rules before writing']
      - file: agents/documenter.md
        span: ['§Project convention', 'rules before writing']
      - file: agents/researcher.md
        span: ['§Project convention', 'rules; stage']
      - file: agents/tester.md
        span: ['§Project convention', 'rules; stage']
      - file: agents/designer.md
        span: ['§Project convention', 'rules; stage']
      - file: agents/profiler.md
        span: ['§Project convention', 'rules; stage']

  - name: the reviewer ranks documents by the implementer's order of authority
    # The reviewer measures a finding against the highest document that speaks to it, so its
    # list must be the implementer's list — a reviewer ranking the design above an open
    # change file punishes a section for following the change it was built for. The reader span
    # covers the reviewer's numbered items only; the bolded names in it must be the
    # implementer's numbered item names. Items that open with a backticked path are not caught
    # by the bold-name reader; the full equality is eval E's mechanical half:
    # evals/2026-09-18-e-order-of-authority-sync-design.md.
    owner: agents/implementer.md
    owner_span: ['## Order of authority', '## The decisions file']
    readers:
      - file: agents/reviewer.md
        span: ['design line that a higher document overrides', 'read together with']

  - name: ledger entry fields its readers parse are ones planning-templates defines
    # One ledger for "the document and the code disagree": the designer and the tester append
    # spec-change entries, the tester regenerates the tests an approved entry's Clause is cited
    # by, and status.py and the stop gate parse the same fields (mechanical, their own evals).
    owner: skills/planning-templates/references/deviations-entry.md
    owner_span: ['1. **Clause**', null]
    readers:
      - file: agents/designer.md
        cites: ['Clause', 'Found', 'Why', 'Status', 'Raised by']
      - file: agents/tester.md
        cites: ['Clause', 'Did', 'Found', 'Status']
      # The implementer appends deviation and spec-change entries field by field.
      - file: agents/implementer.md
        cites: ['Clause', 'Said', 'Did', 'Found', 'Why', 'Status', 'Raised by']
      # The reviewer sets Status on proposed entries, judges them by Why and Clause, and
      # appends spec-change entries with Found in place of Did.
      - file: agents/reviewer.md
        cites: ['Clause', 'Said', 'Found', 'Why', 'Status', 'Raised by', 'Resolved by']
      # The architect verifies an approved entry's Did against the code at its Clause's path
      # before sync-plan applies it, then sets Status and Resolved by.
      - file: agents/architect.md
        cites: ['Clause', 'Did', 'Status', 'Resolved by']
      # pair writes the entries for what was built by hand, field by field, at wrap-up.
      - file: skills/pair/SKILL.md
        cites: ['Clause', 'Said', 'Did', 'Found', 'Why', 'Status', 'Raised by', 'Resolved by']
      # The profiler's verify run, at round 1 or later, appends a spec-change:design entry.
      - file: agents/profiler.md
        cites: ['Clause', 'Said', 'Found', 'Why', 'Status', 'Raised by', 'Resolved by']

  - name: change file headings its readers parse are ones planning-templates defines
    # The architect writes a change file on a CHANGE outcome and sync-plan verifies and applies
    # it by heading; the designer's delta mode designs from its Contract changes; status.py
    # re-opens its Affected sections (mechanical, phase 1's fixture).
    owner: skills/planning-templates/references/change.md
    owner_span: ['1. **Change goal**', null]
    readers:
      - file: agents/architect.md
        cites: ['Change goal', 'Affected sections', 'Contract changes', 'Downstream impact']
      - file: agents/designer.md
        cites: ['Contract changes']

  - name: decisions inbox fields its readers parse are ones planning-templates defines
    # The designer writes stubs and the implementer `Applied:` lines into the inbox; the sync
    # hook parses both by field name and copies `Applied:` lines only, and the run gate fails on
    # an entry the central ledger lacks. A renamed field is a stub the hook merges without its
    # assumption, or an `Applied:` line that never reaches the ledger.
    owner: skills/planning-templates/references/decisions-inbox.md
    owner_span: ['1. **Scope**', null]
    readers:
      - file: agents/designer.md
        cites: ['Scope', 'Raised by', 'Recommendation', 'Assumption if unanswered', 'Status']
      - file: agents/implementer.md
        cites: ['Applied']
      - file: hooks/sync_decisions.py
        cites: ['Applied', 'Status']
      - file: agents/profiler.md
        cites: ['Scope', 'Raised by', 'Recommendation', 'Assumption if unanswered', 'Status']

  - name: review report headings its readers parse are ones planning-templates defines
    # status.py reads the header lines, the fix-round implementer reads CRITICAL and WARNING,
    # the next reviewer reads Carried; a renamed heading leaves each reading nothing.
    owner: skills/planning-templates/references/review-report.md
    owner_span: ['1. **CRITICAL**', null]
    readers:
      - file: agents/reviewer.md
        cites: ['CRITICAL', 'WARNING', 'SUGGESTION', 'Coverage', 'Carried', 'Spec-change', 'Deferred', 'Paths']
      - file: agents/implementer.md
        cites: ['CRITICAL', 'WARNING']

  - name: package contract headings its readers parse are ones the template defines
    # The architect writes the contract from the template's numbered items; the designer reads
    # Section interfaces, Pipelines, Public surface (intent) and Call paths by name, the paths
    # reviewer Call paths, Pipelines and Public surface (intent), and status.py Public surface
    # (intent) and Call paths. A renamed item leaves a reader finding nothing, and a designer
    # that finds no Call paths writes no skeletons (2.6). The owner span ends before the
    # adoption paragraph, which restates the items in prose.
    owner: skills/planning-templates/references/package-contract.md
    owner_span: ['1. **Purpose**', '**Adopting an existing package**']
    readers:
      - file: agents/architect.md
        cites: ['Purpose', 'Sections', 'Data stages', 'Section interfaces', 'Pipelines', 'Call paths',
                'Public surface (intent)', 'Consumes', 'Package conventions', 'Open decisions']
      - file: agents/designer.md
        cites: ['Sections', 'Section interfaces', 'Pipelines', 'Call paths', 'Public surface (intent)', 'Consumes']
      - file: agents/reviewer.md
        cites: ['Sections', 'Section interfaces', 'Pipelines', 'Call paths', 'Public surface (intent)', 'Consumes']
      # The profiler's Data: field is the Data stages row; status.py reads the table and the
      # older Package conventions line; the profile template quotes the row under Plan.
      - file: agents/profiler.md
        cites: ['Data stages', 'Package conventions']
      - file: skills/planning-templates/references/data-profile.md
        cites: ['Data stages', 'Package conventions']
      - file: skills/status/scripts/status.py
        cites: ['Public surface (intent)', 'Call paths', 'Data stages', 'Package conventions']

  - name: the reader's test items its readers cite are ones pipelines.md numbers
    # P3 of the paths review blocks on an item of the reader's test by name, and the designer
    # and the implementer write to the same items. A renamed item leaves a CRITICAL citing a
    # rule the reference no longer has.
    owner: skills/python-style-guide/references/pipelines.md
    owner_span: ["## The reader's test", '## Depth']
    readers:
      - file: agents/reviewer.md
        cites: ['Steps in order', 'Jump by name', 'Named inputs and results', 'Wrapping in view']
      - file: agents/designer.md
        cites: ['Steps in order', 'Jump by name', 'Wrapping in view']
      - file: agents/implementer.md
        cites: ['Steps in order', 'Jump by name']

  - name: docs/constraints.md headings its readers run are ones the template defines
    # set-constraints writes the file from its template; four readers act on it by heading —
    # the reviewer reports Measured (from the gate's output) and honours Exceptions; the
    # implementer, the stop hook (through status.py's parser) and CI run Floor and Enforced. A
    # renamed heading turns each into a check that silently runs nothing. The template's numbered list under the fenced block
    # is what the owner parser reads.
    owner: skills/set-constraints/references/constraints-template.md
    owner_span: ['## Floor', null]
    readers:
      - file: agents/reviewer.md
        cites: ['Measured', 'Exceptions']
      - file: agents/implementer.md
        cites: ['Floor', 'Enforced']
      - file: hooks/gate_on_stop.py
        cites: ['Floor', 'Enforced', 'Guarded', 'Exceptions']
      - file: skills/workspace-scaffold/SKILL.md
        cites: ['Floor', 'Enforced']

  - name: the driver's state names are the ones status.py derives
    # run-package branches on the state column of status.py's rows. A renamed or dropped state
    # leaves the driver's ready-set rule naming a state no row ever shows, and the section
    # sits there. The owner is the module docstring's numbered rule list. The site's
    # **The states** table, in site/reference/running-a-package.md, is the one copy outside
    # the script, for the user.
    owner: skills/status/scripts/status.py
    owner_span: ['1. **BLOCKED**', 'Ready:']
    readers:
      - file: skills/run-package/SKILL.md
        cites: ['BLOCKED', 'PLAN', 'PROBE', 'DESIGN', 'TEST', 'IMPLEMENT', 'REVIEW', 'FIX n', 'DONE']
      - file: site/reference/running-a-package.md
        span: ['## The states', 'A package is **shipped**']

  - name: gate record lines and result values their readers parse are ones the gate writes
    # status.py holds a row on the record's slot, commit and result; the reviewer reads the
    # check lines and the result. The owner is the three numbered lists at the end of the
    # gate's docstring. A renamed value leaves status.py deriving REVIEW for a section whose
    # implementer blocked, which is the fault 2.4 exists to close.
    owner: hooks/gate_on_stop.py
    owner_span: ["The record's lines, in order", "The parsers are status.py's"]
    readers:
      - file: skills/status/scripts/status.py
        cites: ['header', 'commit', 'result', 'attempt', 'blocked', 'spec-change', 'report',
                'not done', 'letting the run stop']
      - file: agents/reviewer.md
        cites: ['header', 'commit', 'checks', 'result', 'pass', 'blocked', 'letting the run stop']
      - file: skills/run-package/SKILL.md
        cites: ['result', 'blocked', 'letting the run stop']

  - name: evidence forms the driver copies are ones status.py prints
    # The driver builds the tester's Regenerate field and the designer's and architect's
    # Spec-change fields by copying headings out of a row's evidence, and asks about a row
    # whose evidence starts `gate `. The owner is the docstring's numbered Evidence list.
    owner: skills/status/scripts/status.py
    owner_span: ['**Evidence.**', '**Gate record.**']
    readers:
      - file: skills/run-package/SKILL.md
        cites: ['open', 'regenerate', 'gate blocked', 'gate let through', 'stage', 'profile cap']

  - name: every field the driver sends the researcher is one the researcher's Inputs defines
    # The driver's block for this role is a table whose bold first column is the fields it fills; a field the agent does not define is a line it never reads, and a renamed one arrives empty.
    owner: agents/researcher.md
    owner_span: ['### Inputs', 'From here the procedure is the same']
    readers:
      - file: skills/run-package/SKILL.md
        span: ['### Researcher — PROBE', '### Designer — DESIGN']

  - name: every field the driver sends the designer is one the designer's Inputs defines
    # The driver's block for this role is a table whose bold first column is the fields it fills; a field the agent does not define is a line it never reads, and a renamed one arrives empty.
    owner: agents/designer.md
    owner_span: ['## Inputs', '## Modes']
    readers:
      - file: skills/run-package/SKILL.md
        span: ['### Designer — DESIGN', '### Tester — TEST']

  - name: every field the driver sends the tester is one the tester's Inputs defines
    # The driver's block for this role is a table whose bold first column is the fields it fills; a field the agent does not define is a line it never reads, and a renamed one arrives empty.
    owner: agents/tester.md
    owner_span: ['## Inputs', 'What each document is for']
    readers:
      - file: skills/run-package/SKILL.md
        span: ['### Tester — TEST', '### Implementer — IMPLEMENT']

  - name: every field status.py --inputs prints is one the implementer's Inputs defines
    # The implementer's block is not a driver table: `status.py --inputs` resolves and prints
    # it, run-package sends it verbatim, and pair reads the files it names. The docstring's
    # numbered list is the fields the code prints (the state-cases `inputs-first-build` case
    # pins every line, in order); a field the agent does not define is a line it never reads,
    # and a renamed one arrives empty.
    owner: agents/implementer.md
    owner_span: ['## Inputs', '## Order of authority']
    readers:
      - file: skills/status/scripts/status.py
        span: ['`--inputs <pkg>/<section>` prints', 'from __future__']

  - name: every field status.py --profile prints is one the profiler's Inputs defines
    # The profiler's block is not a driver table: `status.py --profile` resolves and prints
    # it and run-package sends it verbatim. A field the agent does not define is a line it
    # never reads, and a renamed one arrives empty.
    owner: agents/profiler.md
    owner_span: ['## Inputs', '## Modes']
    readers:
      - file: skills/status/scripts/status.py
        span: ['`--profile <pkg>/<section>` prints', '`--inputs <pkg>/<section>` prints']

  - name: every field the driver sends the reviewer is one the reviewer's Inputs defines
    # The driver's block for this role is a table whose bold first column is the fields it fills; a field the agent does not define is a line it never reads, and a renamed one arrives empty.
    owner: agents/reviewer.md
    owner_span: ['## Inputs', '## Order of authority']
    readers:
      - file: skills/run-package/SKILL.md
        span: ['### Reviewer — REVIEW', '### Architect — PLAN']

  - name: every field the driver sends the architect is one the architect's Inputs defines
    # The driver's block for this role is a table whose bold first column is the fields it fills; a field the agent does not define is a line it never reads, and a renamed one arrives empty.
    owner: agents/architect.md
    owner_span: ['## Inputs', '## Questions — the interview rule']
    readers:
      - file: skills/run-package/SKILL.md
        span: ['### Architect — PLAN', '## Loop']

# Every frontmatter key is one the platform documents and plugins honor. The key lists are
# plugin-anatomy's `frontmatter-keys` blocks, not a copy here: a misspelled key (`allowed_tools`)
# fails as undocumented, and a key plugin agents ignore (`hooks`, `mcpServers`) fails as ignored.
flow:
  - name: the flow page's block agrees with the agents, skills, scripts and hooks
    # site/site.yml's `flow:` block is written by hand and the flow page is drawn from it.
    # This holds it to the files: a role whose file starts naming a skill or a document
    # fails here until the block says whether it runs, writes, reads or only names it.
    file: site/site.yml

frontmatter:
  - name: every agent uses only fields plugin agents honor
    kind: agent
    files: 'agents/*.md'
  - name: every skill uses only documented frontmatter fields
    kind: skill
    files: 'skills/*/SKILL.md'

# A list of names that goes stale when the directory it describes changes.
names_listed:
  - name: every workflow skill is in site.yml's run order
    # The rule in CLAUDE.md. A workflow skill is one the model may not invoke on its own —
    # the user types it — which is exactly what the site orders by run sequence. Unlisted
    # files are appended alphabetically, which is the one thing this list exists to prevent.
    dirs: 'skills/*'
    where: {disable-model-invocation: true}
    form: list
    file: site/site.yml
    span: ['workflow_skills_order:', '# Extra files rendered']
