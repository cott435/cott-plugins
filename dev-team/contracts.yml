# contracts.yml — the cross-file claims this bundle's agents act on, checked by
# plugin-dev's `check-contracts`. One entry per claim that is true only because two files
# agree, and that nothing fails on when they stop agreeing.

# A pattern that must not appear in an authored file.
forbid:
  - name: no file promises a repo a `scripts/` directory
    # project-structure §1 forbids it outright: an entry point must be importable from the
    # installed package, so anything runnable is a function in src/<pkg>/cli.py.
    pattern: '\bscripts/|the scripts that'
    # `near` scopes every exemption below to the match it pardons plus 40 characters either
    # side, not the whole line. Line-scoped, these eight pardoned ten lines outright — every
    # line in the bundle where `scripts/` is discussed, which is exactly where a wrong
    # statement would be written. Probed: evals/2026-09-17-forbid-exemption-scope.md.
    near: 40
    unless:
      - 'no `scripts/`'                 # the prohibition stating itself, and explaining why
      - 'directory beside `src/` looks'
      - 'skills/status/scripts'         # this plugin's own tooling, not a repo it plans
      - 'scripts/status\.py'
      - 'plugin-dev/scripts'

  - name: docs/api/<pkg>.md is never credited to finalize-project alone
    # The implementer writes it in surface mode as each package ships; finalize-project
    # regenerates index.md and fills gaps.
    pattern: 'api/<pkg>\.md|api/\$pkg\.md|api/data\.md'
    near: 40
    all_of: ['finalize-project']
    unless: ['finalize-package']

  - name: no unprefixed plugin command is typeable
    # Plugin skills are always namespaced /dev-team:<name>, so a bare /<name> is a command
    # nobody can run. Structural rather than a list of the 21 names: any slash-initial token
    # with a hyphen, plus /status, that is not already prefixed. Claude Code's own commands
    # have no hyphen (/agents, /model, /plugin) and so never match.
    #
    # Both exceptions are in the pattern, not in `unless`, because `unless` exempts the whole
    # line: /reload-plugins appears in all 14 guard blocks, and a bare command written beside
    # one would have been exempted with it. /reload-plugins is Claude Code's own command.
    pattern: '(^|[\s"(\[`])/(?!dev-team:|reload-plugins)(?:[a-z][a-z0-9]*-[a-z0-9-]+|status)\b'

# Every heading a reader parses is one the owner's template defines.
headings:
  - name: interface.md headings its readers parse are ones the implementer writes
    owner: agents/implementer.md
    owner_span: ['**Write `docs/packages/<pkg>/interface.md`**', null]
    readers:
      - file: agents/documenter.md
        span: ['The ones you read are', 'spelled exactly like that']
      - file: agents/reviewer.md
        cites: ['Public names', 'Shapes provided']
      - file: skills/sync-plan/SKILL.md
        cites: ['Consumers (computed)']
      - file: skills/finalize-project/SKILL.md
        cites: ['Public names']

  - name: probe doc headings its readers parse are ones planning-templates defines
    # A probe doc is the external provider's interface.md, and four agents parse it by heading:
    # the architect stops on Access and reads Supported tasks and Splitting back into the
    # package contract, the designer builds the parser and the feature set from it, the reviewer
    # checks shipped code against Target, Leakage and Splitting, and the implementer falls back
    # to it when its own design disagrees. The researcher writes the document but owns no
    # heading: the template is a reference file, like the architect's five. Both kinds — api and
    # dataset — sit in one span, because a reader cites a heading without knowing which kind the
    # section it is designing will get.
    owner: skills/planning-templates/references/source-probe.md
    owner_span: ['## Kind `api`', null]
    readers:
      - file: agents/designer.md
        cites: ['Observed schema', 'Access', 'Pagination', 'Rate limits and quotas',
                'Error responses', 'Write semantics', 'Webhooks', 'Duplicates and keys',
                'Target', 'Leakage', 'Features', 'Splitting', 'Supported tasks', 'Quirks']
      - file: agents/architect.md
        cites: ['Access', 'Quirks', 'Observed schema', 'Supported tasks', 'Splitting']
      - file: agents/reviewer.md
        cites: ['Observed schema', 'Target', 'Leakage', 'Splitting']
      - file: agents/implementer.md
        cites: ['Observed schema', 'Leakage']

  - name: section README headings its readers parse are ones the implementer writes
    owner: agents/implementer.md
    owner_span: ['## Section README template', '## Deviations']
    readers:
      - file: agents/documenter.md
        cites: ['Entry points and interfaces']

# A list of names that goes stale when the directory it describes changes.
names_listed:
  - name: every skill this plugin ships is named in reserved-skill-names
    # The architect skips these when enumerating a project's skills and extract-legacy
    # refuses to overwrite one. Neither can derive the list: at run time a plugin skill and a
    # project skill are both just directories under .claude/skills/.
    dirs: 'skills/*'
    file: skills/reserved-skill-names/SKILL.md
    span: ['## Workflow skills', '## What each reader does with it']

  - name: README's Contents tree names every skill this plugin ships
    # Item 2 of the three-file rule in CLAUDE.md. The tree is the only place a reader learns
    # what the plugin contains, and it is a fenced code block, so names appear as branches
    # rather than in backticks.
    dirs: 'skills/*'
    form: tree
    file: README.md
    span: ['└── skills/', 'site/                         the authored parts']

  - name: every workflow skill is in site.yml's run order
    # Item 3 of the same rule. A workflow skill is one the model may not invoke on its own —
    # the user types it — which is exactly what the site orders by run sequence. Unlisted
    # files are appended alphabetically, which is the one thing this list exists to prevent.
    dirs: 'skills/*'
    where: {disable-model-invocation: true}
    form: list
    file: site/site.yml
    span: ['workflow_skills_order:', '# Extra files rendered']
