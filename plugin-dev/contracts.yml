# contracts.yml — the cross-file claims this bundle makes about itself, checked by its own
# `check-contracts`. One entry per claim that is true only because two files agree.

forbid:
  - name: no skill or agent description contains an XML-style tag
    # claude.ai rejects the whole plugin ("SKILL.md description cannot contain XML tags")
    # for any <word> in a frontmatter description, so the desktop app stops listing it. The
    # CLI accepts it, so nothing else catches this. Write placeholders as {word}.
    pattern: '^description:.*<[A-Za-z/]'
    files: ['agents/*.md', 'skills/*/SKILL.md']

  - name: no unprefixed plugin command is typeable
    # Plugin skills are namespaced /plugin-dev:<name>; a bare /<name> is a command nobody
    # can run. Any slash-initial hyphenated token that is not already prefixed with
    # `<something>:` — so /dev-team:plan-repo in an example is fine, /plan-phases is not.
    # /reload-plugins is Claude Code's own. Claude Code's other commands (/plugin, /agents)
    # have no hyphen and never match.
    pattern: '(^|[\s"(\[`])/(?!reload-plugins|[a-z][a-z0-9-]*:)(?:[a-z][a-z0-9]*-[a-z0-9-]+)\b'

names_listed:
  - name: README's skills table names every skill this plugin ships
    # "The skills" is the one list of them, and the README says so. Backticked names
    # anywhere in the span, so the span must contain no other backticked lowercase-hyphen
    # word: paths carry a slash or a dot and never match.
    dirs: 'skills/*'
    form: code
    file: README.md
    span: ['## The skills', '## The rest of the bundle']

  - name: every typed skill is in site.yml's run order
    # The two skills a person types (disable-model-invocation: true) render in run order on
    # the site; an unlisted one falls to the alphabetical tail.
    dirs: 'skills/*'
    where: {disable-model-invocation: true}
    form: list
    file: site/site.yml
    span: ['workflow_skills_order:', null]

headings:
  - name: run-evals names every eval kind eval-kinds.md defines
    # eval-kinds.md is the one list; SKILL.md must not name a kind it does not define.
    owner: skills/run-evals/references/eval-kinds.md
    owner_span: ['## The kinds', '## Baselines']
    readers:
      - file: skills/run-evals/SKILL.md
        cites: ['mechanical', 'load', 'behavioral', 'trigger', 'platform-fact']
      - file: skills/plan-phases/SKILL.md
        cites: ['mechanical', 'load', 'behavioral', 'trigger', 'platform-fact']

  - name: plan-phases names only design sections the design template defines
    # templates/phases/design.md is the one list of the design's sections (its `##`
    # headings); design-plugin writes from it and plan-phases reads the design by those names.
    owner: templates/phases/design.md
    owner_form: markdown
    readers:
      - file: skills/plan-phases/SKILL.md
        cites: ['Decisions taken', 'Build order', 'What must not break']

  - name: revise-plugin's edit list is read only by the sections its template defines
    # templates/review/edits.md is the one list of the edit list's sections; the reconcile
    # agent writes from it, revise-plugin asks into Decisions taken and moves items to Needs
    # a design, plan-phases and run-phase print sections by name with sed, design-plugin
    # designs Needs a design, and scripts/edits.py parses Edits, Decisions taken and Build
    # order. A section renamed in the template is a change to every one of them.
    owner: templates/review/edits.md
    owner_form: markdown
    readers:
      - file: skills/revise-plugin/SKILL.md
        cites: ['Decisions taken', 'Edits', 'Needs a design', 'Issues']
      - file: skills/revise-plugin/references/reconcile-prompt.md
        cites: ['Edits', 'Decisions taken', 'Needs a design', 'Build order', 'Issues',
                'Conflicts', 'Non-goals']
      - file: skills/plan-phases/SKILL.md
        cites: ['Goal', 'Decisions taken', 'Platform facts', 'Build order',
                'What must not break', 'Needs a design']
      - file: skills/run-phase/SKILL.md
        cites: ['Goal', 'Decisions taken', 'What must not break']
      - file: skills/design-plugin/SKILL.md
        cites: ['Needs a design', 'Goal', 'Decisions taken']
      - file: scripts/edits.py
        cites: ['Edits', 'Decisions taken', 'Build order']

  - name: edits.py checks only findings-file sections the findings template defines
    owner: templates/review/findings.md
    owner_form: markdown
    readers:
      - file: scripts/edits.py
        cites: ['Findings', 'Checked, no finding']

  - name: the phase note run-phase writes has only sections the phase template defines
    owner: templates/phases/phase.md
    owner_form: markdown
    readers:
      - file: skills/run-phase/SKILL.md
        cites: ['Decisions', 'Files', 'Specification', 'Steps', 'Evals', 'Done when']

  - name: plan-phases and run-phase name only overview sections the overview template defines
    owner: templates/phases/overview.md
    owner_form: markdown
    readers:
      - file: skills/plan-phases/SKILL.md
        cites: ['Phases', 'Files other files parse', 'Evals by phase']
      - file: skills/run-phase/SKILL.md
        cites: ['Files other files parse', 'Evals by phase']
      - file: scripts/edits.py
        cites: ['Phases']

  - name: audit-run, fix-issues and bump-version name only issue-file sections the issue template defines
    # templates/audits/issue.md is the one list; issues.py writes from it, and the skills
    # name its sections when they say who writes what: audit-run the Finding, Found in
    # and Checks; fix-issues the Fix attempts; bump-version only fixed_in in a Fix attempt.
    owner: templates/audits/issue.md
    owner_form: markdown
    readers:
      - file: skills/audit-run/SKILL.md
        cites: ['Finding', 'Found in', 'Checks']
      - file: skills/fix-issues/SKILL.md
        cites: ['Fix', 'Found in']
      - file: skills/bump-version/SKILL.md
        cites: ['Fix']

  - name: audit-run and fix-issues name only run-report sections the report template defines
    owner: templates/audits/run-report.md
    owner_form: markdown
    readers:
      - file: skills/audit-run/SKILL.md
        cites: ['Errors', 'Warnings', 'Notes', 'Prior issues', 'Audited', 'Not audited',
                'Dropped on spot-check']
      - file: skills/fix-issues/SKILL.md
        cites: ['Errors', 'Warnings', 'Notes']

  - name: audit-run and fix-issues use only the prior-issue verdicts run-auditor defines
    # run-auditor writes the P lines; its numbered list under "## Prior issues" is the one
    # list of held / recurred / not exercised. `not testable` is audit-run's own word for an
    # issue no auditor was given, and is defined there.
    owner: agents/run-auditor.md
    owner_span: ['## Prior issues', '## Severity and fault']
    readers:
      - file: skills/audit-run/SKILL.md
        cites: ['held', 'recurred', 'not exercised']
      - file: skills/fix-issues/SKILL.md
        cites: ['held', 'recurred']

frontmatter:
  - name: every skill's frontmatter uses only documented skill fields
    # The allowed keys are plugin-anatomy's references/skills.md block, read by the checker.
    kind: skill
    files: 'skills/*/SKILL.md'

  - name: every agent's frontmatter uses only documented agent fields, none plugins ignore
    # Same check for the one agent, run-auditor. A plugin agent silently drops hooks,
    # mcpServers, permissionMode and initialPrompt; the checker fails on them.
    kind: agent
    files: 'agents/*.md'
