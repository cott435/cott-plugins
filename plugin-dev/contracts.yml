# contracts.yml — the cross-file claims this bundle makes about itself, checked by its own
# `check-contracts`. One entry per claim that is true only because two files agree.

forbid:
  - name: no skill or agent description contains an XML-style tag
    # claude.ai rejects the whole plugin ("SKILL.md description cannot contain XML tags")
    # for any <word> in a frontmatter description, so the desktop app stops listing it. The
    # CLI accepts it, so nothing else catches this. Write placeholders as {word}.
    pattern: '^description:.*<[A-Za-z/]'
    files: ['agents/*.md', 'skills/*/SKILL.md']

  - name: no unprefixed plugin command is typeable
    # Plugin skills are namespaced /plugin-dev:<name>; a bare /<name> is a command nobody
    # can run. Any slash-initial hyphenated token that is not already prefixed with
    # `<something>:` — so /dev-team:plan-repo in an example is fine, /plan-phases is not.
    # /reload-plugins is Claude Code's own. Claude Code's other commands (/plugin, /agents)
    # have no hyphen and never match.
    pattern: '(^|[\s"(\[`])/(?!reload-plugins|[a-z][a-z0-9-]*:)(?:[a-z][a-z0-9]*-[a-z0-9-]+)\b'

names_listed:
  - name: README's skills table names every skill this plugin ships
    # "The skills" is the one list of them, and the README says so. Backticked names
    # anywhere in the span, so the span must contain no other backticked lowercase-hyphen
    # word: paths carry a slash or a dot and never match.
    dirs: 'skills/*'
    form: code
    file: README.md
    span: ['## The skills', '## The rest of the bundle']

  - name: every typed skill is in site.yml's run order
    # The two skills a person types (disable-model-invocation: true) render in run order on
    # the site; an unlisted one falls to the alphabetical tail.
    dirs: 'skills/*'
    where: {disable-model-invocation: true}
    form: list
    file: site/site.yml
    span: ['workflow_skills_order:', null]

headings:
  - name: run-evals names every eval kind eval-kinds.md defines
    # eval-kinds.md is the one list; SKILL.md must not name a kind it does not define.
    owner: skills/run-evals/references/eval-kinds.md
    owner_span: ['## The kinds', '## Baselines']
    readers:
      - file: skills/run-evals/SKILL.md
        cites: ['mechanical', 'load', 'behavioral', 'trigger', 'platform-fact']
      - file: skills/plan-phases/SKILL.md
        cites: ['mechanical', 'load', 'behavioral', 'trigger', 'platform-fact']

  - name: plan-phases names only design sections the design template defines
    # templates/phases/design.md is the one list of the design's sections (its `##`
    # headings); design-plugin writes from it and plan-phases reads the design by those names.
    owner: templates/phases/design.md
    owner_form: markdown
    readers:
      - file: skills/plan-phases/SKILL.md
        cites: ['Components', 'How they fit together', 'Decisions taken', 'Build order',
                'What must not break']

frontmatter:
  - name: every skill's frontmatter uses only documented skill fields
    # The allowed keys are plugin-anatomy's references/skills.md block, read by the checker.
    kind: skill
    files: 'skills/*/SKILL.md'
