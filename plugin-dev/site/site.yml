# Per-plugin config for the shared site builder (scripts/build_site.py).
# Every key is optional; this file exists to fix the reading order of the workflow pages.

# The two routes to a spec (from an idea, from facts), what both hand to, then how a run is
# checked.
workflows_order:
  - design-a-workflow
  - revise-from-facts
  - plan-and-run-phases
  - audit-a-run

# Workflow skills in the order you run them; the automatic three follow alphabetically.
workflow_skills_order:
  - design-plugin
  - revise-plugin
  - plan-phases
  - run-phase
  - run-phases
  - audit-run
  - fix-issues

# The flow page (site/flow.md). Its markers are filled from this block: who uses which
# skill, who writes and reads which document, and how each driver runs.
flow:
  # The roles, left to right in the charts. A name that is an agent or a skill links to its
  # page; any other needs a label. Anyone else a document names (a script, you) is shown in
  # the documents table only.
  roles:
    - {id: design-plugin, note: driver}
    - {id: revise-plugin, note: driver}
    - {id: unit-agent, label: unit agent, note: of revise-plugin, file: skills/revise-plugin/references/unit-prompt.md}
    - {id: reconcile-agent, label: reconcile agent, note: of revise-plugin, file: skills/revise-plugin/references/reconcile-prompt.md}
    - {id: plan-phases, note: driver}
    - {id: eval-writer, label: eval writer, note: of plan-phases, file: skills/plan-phases/references/eval-writer.md}
    - {id: unit-planner, label: unit planner, note: of plan-phases, file: skills/plan-phases/references/unit-planner.md}
    - {id: unify-agent, label: unify agent, note: of plan-phases, file: skills/plan-phases/references/unify.md}
    - {id: run-phases, note: driver}
    - {id: run-phase, note: one phase}
    - {id: run-evals, note: runner}
    - {id: fix-issues, note: driver}
    - {id: audit-run, note: driver}
    - run-auditor
    - {id: run-flow, note: driver}
    - run-narrator
    - {id: bump-version, note: on your yes}

  # Skills a role runs or loads. An agent's own `skills:` frontmatter is read from its file.
  # `names` are skills the role's file mentions without running: check-contracts fails on a
  # mention that is in none of the three lists, and on an entry the file no longer mentions.
  uses:
    design-plugin:
      always: [plugin-anatomy]
      sometimes:
        - new-plugin: a new plugin, once the writeup is approved
        - check-contracts: the plugin has a `contracts.yml`
    revise-plugin:
      sometimes:
        - check-contracts: the plugin has a `contracts.yml`
      names: [plugin-anatomy]
    plan-phases:
      always: [plugin-anatomy]
      names: [build-site, bump-version, check-contracts, run-evals]
    eval-writer:
      always: [plugin-anatomy]
      names: [run-evals]
    unit-planner:
      always: [plugin-anatomy]
      names: [run-phase]
    unify-agent: {}
    run-phases:
      names: [bump-version, plugin-anatomy, run-evals]
    run-phase:
      always: [plugin-anatomy, check-contracts]
      sometimes:
        - build-site: the last phase
        - run-evals: the phase is a checkpoint
      names: [bump-version, log-eval]
    run-evals:
      always: [log-eval]
      names: [build-site, check-contracts, plugin-anatomy]
    fix-issues:
      always: [plugin-anatomy, check-contracts, build-site]
      sometimes:
        - run-evals: a set covers a file the fix touched
      names: [bump-version, log-eval]
    audit-run:
      always: [log-eval]
      names: [check-contracts, run-flow]
    run-flow:
      names: [plugin-anatomy]
    bump-version:
      names: [build-site, log-eval, new-plugin, plugin-anatomy]

  # Every document a role writes or reads. `match` is how a role's file names it when that
  # is not its path; `names` are roles whose file mentions it without touching it; `match:
  # false` leaves out a document too general to look for. check-contracts fails when a role
  # here does not name the document, and when a role that names it is in none of the lists.
  documents:
    - name: the design
      path: site/notes/<slug>/<slug>-design.md
      writes: [design-plugin]
      reads: [plan-phases, eval-writer, {unit-planner: for the why}, {run-phase: for the why}]
    - name: review plan
      path: site/notes/<slug>/<slug>-review-plan.md
      match: "-review-plan.md"
      writes: [revise-plugin]
      reads: [unit-agent, reconcile-agent]
    - name: unit findings
      path: site/notes/<slug>/findings/<UNIT>.md
      match: "notes/<slug>/findings"
      writes: [unit-agent]
      reads: [reconcile-agent, {unit-agent: "a synthesis unit, by kind"}, {revise-plugin: "only `edits.py findings`' verdict on them"}]
    - name: the edit list
      path: site/notes/<slug>/<slug>-edits.md
      match: "-edits.md"
      writes: [reconcile-agent, {revise-plugin: the decisions you answer}]
      reads:
        - plan-phases: "`edits.py index`, `edits.py split`"
        - unit-planner: "its phase's items, through `phases.py brief --phase`"
        - run-phase: "`edits.py show --phase`, for a plan with no notes"
        - design-plugin: its Needs a design items
        - eval-writer
    - name: the overview
      path: site/notes/<slug>/<slug>-00-overview.md
      match: ["-00-overview.md", "the overview"]
      writes: [plan-phases, {unify-agent: its Files other files parse table}]
      reads: [{run-phase: "`phases.py brief`"}, {unit-planner: "`phases.py brief --phase`"}, unify-agent, eval-writer]
      names: [run-phases]
    - name: the phase ledger
      path: site/notes/<slug>/<slug>-progress.md
      match: ["-progress.md", "phases.py"]
      writes: [{plan-phases: the empty rows}, {run-phase: "`phases.py finish`"}]
      reads: [{run-phases: "`phases.py next`, `check`"}, {run-phase: "`phases.py brief`"}, {unit-planner: "`phases.py brief --phase`"}, {unify-agent: "`phases.py notes-check`"}]
    - name: eval sets
      path: evals/sets/<target>.json
      match: evals/sets
      writes: [eval-writer, {plan-phases: a set its writer left failing}, {run-phase: a fix its graders call for}]
      reads: [run-evals, {fix-issues: the sets covering a file it touched}, {revise-plugin: their names}]
    - name: phase note
      path: site/notes/<slug>/<slug>-NN-<name>.md
      writes: [unit-planner, {unify-agent: the names made to agree}, {run-phase: "its Deviations; the whole note, for a plan from before 3.1"}]
      reads: [{run-phase: "the plan for its edits"}, {unit-planner: the earlier phases' on its files}, unify-agent, {plan-phases: "`phases.py notes-check`"}]
    - name: the plugin's files
      path: agents/ · skills/ · hooks/ · scripts/
      match: false
      writes: [run-phase, fix-issues]
      reads:
        - design-plugin: what the change touches
        - unit-agent: one role, whole
        - unit-planner: the files its phase owns
        - run-evals: the target
        - run-auditor: at the version that ran
    - name: platform facts
      path: skills/plugin-anatomy/references/
      match: plugin-anatomy/references
      writes: [{run-phase: a fact an eval proved}]
      reads: [plan-phases, eval-writer, unit-planner, run-phase, fix-issues]
    - name: eval workspace
      path: evals/workspace/<target>/iteration-N/
      match: evals/workspace
      writes: [run-evals]
      reads: [{you: in the viewer}]
      names: [run-phases]
    - name: eval log
      path: evals/<date>-<subject>.md
      match: ["log-eval", "eval log"]
      writes: [{run-evals: through `log-eval`}, {audit-run: through `log-eval`}]
      reads: [{run-phase: "`phases.py finish` wants one per eval row"}, fix-issues]
      names: [revise-plugin, plan-phases, bump-version]
    - name: the run's trace
      path: runs/<project>/<command> <title>/<id8>/
      match: ["units/U", "run.md"]
      writes: [{audit-run: "`trace.py`"}, {run-flow: "`trace.py`"}]
      reads: [{run-auditor: its one piece}, {run-narrator: one unit}]
    - name: auditor findings
      path: runs/…/<id8>/findings/
      match: ["<workspace>/findings", "Findings file"]
      writes: [run-auditor]
      reads: [{audit-run: "merges, spot-checks"}, {run-auditor: the cross pass}]
    - name: issues
      path: runs/audits/issues/<ID>.md
      match: ["runs/audits", "issues.py", "Prior issues"]
      writes:
        - audit-run: new, seen, verdicts
        - fix-issues: a Fix attempt
        - "a plan's last phase": a Fix attempt per issue its edits closed
        - bump-version: "`fixed_in`"
      reads:
        - audit-run: fixes to check
        - run-auditor: those on its piece
        - fix-issues
        - revise-plugin: "`issues.py list`"
        - reconcile-agent: the index
        - unit-agent: the ones its row names
      names: [plan-phases, run-flow]
    - name: run report
      path: runs/audits/reports/<date>-<id8>.md
      match: reports/
      writes: [audit-run]
      reads: [fix-issues]
    - name: agent account
      path: runs/…/<id8>/explain/U<nn>.md
      match: explain/
      writes: [run-narrator]
      reads: [run-flow]
    - name: the release
      path: plugin.json · marketplace row · CHANGELOG.md · tag
      match: false
      writes: [bump-version]
      reads: [whoever installs the plugin]

  # One entry per driver: what tells it the next step, the ledger behind that, what it
  # spawns, what writes the ledger, and the hooks that hold a step.
  drivers:
    - skill: run-phases
      ledger: "`<slug>-progress.md`, one row per phase"
      next: "`phases.py next`"
      spawns: one fresh agent per phase, following run-phase
      returns: "Status: committed | review | question | proposal | blocked"
      writer: "`phases.py finish`: the row and the commit"
      held: "`gate_stop.py`, on `Stop` and `SubagentStop`: a phase committed without `phases.py finish` is checked before its chat stops"
    - skill: revise-plugin
      ledger: "`findings/<UNIT>.md`, one per unit, then `<slug>-edits.md`"
      next: "`edits.py findings`, then `edits.py check`"
      spawns: a wave of unit agents, twelve at most, then one reconcile agent
      returns: three lines, the file's path first
      writer: each agent writes its one file
      held: "no hook: `edits.py` refuses a findings file out of shape and an edit list that drops a finding; one commit per wave"
    - skill: audit-run
      ledger: "`findings/` in the run's workspace; across runs, `runs/audits/issues/`"
      next: "`trace.py select`"
      spawns: one run-auditor per unit and per driver segment, then one across them
      returns: its findings file
      writer: each auditor writes its one file
      held: "no hook: every ERROR and verdict is spot-checked at its trace step, and `issues.py check` must print `ok` before the commit"
    - skill: run-evals
      ledger: "`evals/workspace/<target>/iteration-N/`"
      next: "`eval_workspace.py run`"
      spawns: headless sessions, executors then graders
      returns: one report
      writer: the runner script
      writer_in: driver
      held: "`guard_agent.py`, on `PreToolUse` of `Agent`: refuses an executor or grader started one spawn at a time for an iteration the runner should run"
    - skill: fix-issues
      ledger: "`runs/audits/issues/<ID>.md`"
      next: "`issues.py route`, then `issues.py list`"
      writer: "`issues.py`: a Fix attempt per issue"
      held: "no hook: nothing is edited before your yes to the plan"
