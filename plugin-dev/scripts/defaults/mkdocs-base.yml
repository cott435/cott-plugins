# Kit default base config. build_site.py writes this plus a generated nav to
# <bundle>/site/mkdocs.yml, so adding or renaming a skill never means editing a nav list.
# To customize the theme for one plugin, copy this file to that repo's site/mkdocs-base.yml
# and edit it there — build_site.py prefers the repo's copy over this one, verbatim.
site_name: __SITE_NAME__
site_description: Reading site for the __PLUGIN_NAME__ agents + skills plugin
docs_dir: docs
use_directory_urls: false

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.inlinehilite

plugins:
  - search

extra_css:
  - extra.css
